
[package]
name = "api"
version = "0.1.0"
edition = "2021"
default-run = "api"

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "cli"
path = "src/cli.rs"
[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
shellexpand = "3"
solana-sdk = "1.18"
solana-client = "1.18"


common = { path = "../common" }
executor = { path = "../executor" }
mev = { path = "../mev" }
strategies = { path = "../strategies" }
dialoguer = "0.11"
reqwest = { version = "0.11", features = ["json"] }
